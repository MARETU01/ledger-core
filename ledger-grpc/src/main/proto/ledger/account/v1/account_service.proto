syntax = "proto3";

package ledger.account.v1;

option java_package = "com.ledger.pb.account.v1";
option java_multiple_files = true;

service AccountService {
  // 学习示例，不访问数据库或修改账户。
  rpc SayHello(SayHelloRequest) returns (SayHelloResponse);
}

message SayHelloRequest {
  // 不传或只有空白时使用 World。
  string name = 1;
}

message SayHelloResponse {
  string message = 1;
  string service = 2;
}
