spring:
  application:
    name: account-service
  profiles:
    default: dev
  main:
    web-application-type: none
  cloud:
    nacos:
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        group: ${NACOS_GROUP:LEDGER_GROUP}
        metadata:
          protocol: grpc
      config:
        group: ${NACOS_GROUP:LEDGER_GROUP}
