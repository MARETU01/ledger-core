spring:
  application:
    name: trading-service
  profiles:
    default: dev
  main:
    web-application-type: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: trading
    schemas: trading
    create-schemas: true
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    validate-migration-naming: true
  cloud:
    nacos:
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        group: ${NACOS_GROUP:LEDGER_GROUP}
        metadata:
          protocol: grpc
      config:
        group: ${NACOS_GROUP:LEDGER_GROUP}

# 仅启用实际依赖的下游客户端；连接在第一次调用时创建。
ledger:
  grpc:
    client:
      enabled: true
      account:
        enabled: true
