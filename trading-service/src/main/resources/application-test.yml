# test profile 自动加载：先连接 Nacos，再依次加载公共配置和服务专属配置。
spring:
  config:
    import:
      - nacos:ledger-infrastructure.yml?group=${NACOS_GROUP:LEDGER_GROUP}
      - nacos:${spring.application.name}.yml?group=${NACOS_GROUP:LEDGER_GROUP}
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:ledger-test}
      config:
        namespace: ${NACOS_NAMESPACE:ledger-test}
