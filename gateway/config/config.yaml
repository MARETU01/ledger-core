# 网关启动配置；相对路径以本文件所在目录为基准。修改后重启网关。
listen_addr: 127.0.0.1:8080
routes_source: file # dev 使用本地路由，Nacos 仅做服务发现；也可按需切换为 nacos
routes_file: routes.yml
nacos_data_id: gateway-routes.yml
descriptor_dir: ..
# 留空使用 Nacos；也可填写 service=host:port;service=host:port,host:port
static_targets: ""
api_token: ""
# 留空使用系统用户缓存目录下的 ledger-core-gateway
state_dir: ""
grpc_tls:
  enabled: false
  ca_file: ""
  server_name: ""
nacos:
  server_addr: localhost:8848
  namespace: ledger-dev # 与 Java dev 环境保持一致；test/prod 使用对应的 namespace ID
  group: LEDGER_GROUP
  username: ""
  password: ""
  tls:
    enabled: false
    ca_file: ""
    server_name: ""
