# 将完整内容发布到 Nacos 的 gateway-routes.yml；网关不读取本文件。
# 服务级配置替代旧 routes 列表。配置的 protobuf service 中所有 unary 方法允许 POST。
version: 1
revision: services-1
services:
  account:
    target_service: account-service
    proto_services:
      v1: ledger.account.v1.AccountService
    get_methods:
      v1: [SayHello]
    timeout: 2s
  trading:
    target_service: trading-service
    proto_services:
      v1: ledger.trading.v1.TradingService
    get_methods:
      v1: [SayHello]
    timeout: 3s
