syntax = "proto3";
package ledger.platform.v1;
option java_package = "com.ledger.pb.platform.v1";
option java_multiple_files = true;

// Framework diagnostics only; these RPCs do not execute financial operations.
service AccountProbe {
  rpc Check(ProbeRequest) returns (ProbeReply);
}
service TradingProbe {
  // Probes trading-service -> account-service over gRPC.
  rpc Check(ProbeRequest) returns (ProbeReply);
}
message ProbeRequest { string request_id = 1; }
message ProbeReply {
  string service = 1;
  string request_id = 2;
  string downstream_service = 3;
}
